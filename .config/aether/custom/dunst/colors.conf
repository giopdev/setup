[global]
    background = "{background}"
    foreground = "{foreground}"
    frame_color = "{accent}"
    separator_color = "{muted}"
    highlight = "{accent}"

[urgency_low]
    frame_color = "{muted}"

[urgency_normal]
    frame_color = "{accent}"

[urgency_critical]
    frame_color = "{red}"
    foreground = "{foreground}"
